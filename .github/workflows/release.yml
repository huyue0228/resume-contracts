name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/check.yml
  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release ref and package version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python -m pip install . build "setuptools>=68" wheel
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$GITHUB_ACTOR" == "$GITHUB_REPOSITORY_OWNER" ]]
            echo "RELEASE_VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]] && gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Version already released; use a new version"; exit 1
          fi
      - name: Build, install-smoke and checksum
        run: make package PYTHON=python RELEASE_VERSION="$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: contract-distributions
          path: dist/
          retention-days: 7
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/v*/* --verify-tag --generate-notes "${args[@]}"
