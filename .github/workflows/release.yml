name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/check.yml
  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release ref and package version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python -m pip install . build
          python - <<'PY'
          import os, tomllib
          from resume_contracts import VERSION
          from pathlib import Path
          assert VERSION == tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if os.environ["GITHUB_REF"].startswith("refs/tags/"):
              assert os.environ["GITHUB_ACTOR"] == os.environ["GITHUB_REPOSITORY_OWNER"]
              assert os.environ["GITHUB_REF_NAME"] == "v" + VERSION
          PY
          if [[ "$GITHUB_REF" == refs/tags/* ]] && gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Version already released; use a new version"; exit 1
          fi
      - name: Build and test installed distributions
        run: |
          python -m build
          python -m venv /tmp/contracts-wheel
          /tmp/contracts-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/contracts-wheel/bin/python -m resume_contracts.verify
          /tmp/contracts-wheel/bin/resume-kernel-mock --help
      - name: Check distribution checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: contract-distributions
          path: dist/
          retention-days: 7
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes "${args[@]}"
